[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501",  # legacy long lines; tighten after router refactor
  "S101",  # allow asserts in tests
  "S608",  # SQL is being migrated incrementally to parameterized calls
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
