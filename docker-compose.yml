services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./
    platform: linux/amd64
    ports:
      - "5001:5001"
    environment:
      ANALYSIS_DASHBOARD_CONFIG: /app/config.yml
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      PYTHONUNBUFFERED: 1
      DEV_BYPASS_LOGIN: "true"
    volumes:
      # Local development fallback. Prefer DATABASE_* values in .env for deployments.
      - ./config.yml:/app/config.yml:ro
      - .:/app  # Mount source for auto-reload
      - /app/__pycache__  # Exclude pycache
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5001", "--reload"]
    restart: unless-stopped
