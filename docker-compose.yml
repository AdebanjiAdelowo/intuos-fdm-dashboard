services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build:
      context: ./
    platform: linux/amd64
    ports:
      - "5001:5001"
    environment:
      ANALYSIS_DASHBOARD_CONFIG: /app/config.yml
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      PYTHONUNBUFFERED: 1
      # Dev-only auth bypass (see app.py:login, controllers/login.py:retrieve_connection_params).
      # Defaults to disabled; opt in locally with `DEV_BYPASS_LOGIN=true docker compose up`
      # or a docker-compose.override.yml. Never set this to true outside local development.
      DEV_BYPASS_LOGIN: ${DEV_BYPASS_LOGIN:-false}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - .:/app
      - /app/__pycache__
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5001", "--reload"]
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
